[project]
name = "kipl-ml"
version = "0.1.0"
description = "ML operations and utils for website fingerprinting an their defences."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "ipython>=9.6.0",
    "laserbeak",
    "matplotlib>=3.10.0",
    "maturin>=1.8.1",
    "mbnt-rustbindings",
    "mlflow==3",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
    "seaborn>=0.13.2",
    "tables>=3.10.2",
    "torch>=2.5.1",
    "torchtune>=0.5.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
mbnt-rustbindings = { path = "../mbnt-rustbindings" } # For Eph. use tag: v0.4
# mbnt-rustbindings = { git = "ssh://git@github.com/topiko/mbnt-rustbindings.git", branch="main" }
laserbeak = { git = "ssh://git@github.com/topiko/laserbeak.git" } # For Eph. use tag: v0.0

# For maybenot use commit: c41b3bf590e4a88e44744d75f56de8d1a4f1d1d7
# For maybenot-gen use commit: 5ed0138c7bc0d5c68c53628e56c8ccd2e6040ff8
