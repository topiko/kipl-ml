[project]
name = "kipl-ml"
version = "0.1.0"
description = "ML operations and utils for website fingerprinting an their defences."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "laserbeak",
    "matplotlib>=3.10.0",
    "maturin>=1.8.1",
    "mbnt-rustbindings",
    "mlflow>=2.20.0",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
    "seaborn>=0.13.2",
    "tables>=3.10.2",
    "torch>=2.5.1",
    "torchtune>=0.5.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
mbnt-rustbindings = { git = "ssh://git@github.com/topiko/mbnt-rustbindings.git", branch="main" }
laserbeak = { git = "ssh://git@github.com/topiko/laserbeak.git" }
