defaults:
  - _self_
  - defence: no_defence
  - dataset: bigenough
  - network: infinite
  - misc: default

experiment_name: sisypus
debug: False

mlflow:
  # Parent MLflow run name. Child runs are auto-numbered (001, 002, ...).
  parent_run_name: "sisyphus"


trace:
  trim_beginning: 10
  len: 5_000
  min_packets: 1000
  dur_max: 40 # max trace duration in seconds; clamps to (0, this, True); null=disabled
  # If set, exclude traces where time_to_<trace_len>_packets exceeds this value.
  # Requires metadf generated by latest conversion script.
  exclude_longer_than_s: null

advantages:
  type: "mc"
  lambda_: 0.95
  standardize: False
  divide_by_Z: False

rewards:
  d_clf: 0.001
  padding_scale: 0.01
  delay_scale: 0.0001 # 0.0000001

obs:
  # Floor for action prob:
  prob_eps: 0.04
  time_step_s: 0.02
  max_silence_s: 0.06
  detach_period: 300
  critic_detach_period: 500
  lr: 0.0007
  critic_lr: 0.0005
  send_mode: "fixed"
  enable_delay: False
  # Number of packets to send when selector chooses send actions.
  send_count_bins: [5, 20, 50, 100, 200]
  # Delay (in action bins) before scheduled send actions.
  send_after_bins: [0, 1, 3, 5, 7, 9]
  # Delay action duration choices (in bins).
  delay_duration_bins: [1, 2, 4, 8]

  hsize: 256
  nhidden: 3
  #
  # When going up the ret needs to be higher than this
  # against the curent disc league.
  ret_thres_push: 50
  init_for_wait: True
  enable_entropy_loss: True
  separate_critic: False
  selection_entropy_scale: 0.005
  conditional_entropy_scale: 0.0005
  rnn_lr_reduction: 1.0

  # When starting a new push; use the obs and critic from the last push.
  # If false, the obs and critic will be randomly initialized at the start of each push.
  reuse_obs_and_critic: True

  # How many epochs to iterate before lowering padding scale.
  rewards_rescale_epochs: 7

  # After this you reset the obs and critic and return...
  max_epochs_per_push: 91

  # How much we decrease padding scale when hitting max epochs.
  padding_scale_reduction: 0.7

  lr_scheduler_patience: 7
  lr_scheduler_factor: .8

disc:
  detach_period: 500
  # When coming down the disc needs to get below this against the
  loss_thres_roll: 1.0
  lr: 0.001
  predict_ks: 21

  tam_max_load_time_s: 90
  batch_size: 64
  train_defence_aug: 5  # Cache defended traces during disc training (1=enabled, 0=disabled)

  no_defense_disc_id: "m-3a65302e5214463dbe7cb150ddcacdcb"

league:
  score_type: "acc"
  size: 24
  enforce_orig: True
  random_frac: 0.25


ema_decay: 0.95
grad_norm_clip: 1
discounting: 0.99
batch_size: 256
label_smoothing: 0.02

max_epochs: 99
