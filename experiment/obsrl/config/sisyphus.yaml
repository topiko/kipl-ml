defaults:
  - _self_
  - defence: no_defence
  - dataset: bigenough
  - network: infinite
  - misc: default


advantages:
  type: "mc"
  lambda_: 0.95
  standardize: False
  divide_by_Z: False

rewards:
  d_clf: 0.001

# When going up the ret needs to be higher than this
# against the curent disc league.
ret_thres_push: 50
# When coming down the disc needs to get below this against the
# current obs league
disc_loss_thres_roll: 1.5

experiment_name: sisypus
debug: False
enable_entropy_loss: True
init_for_wait: True
separate_critic: True

padding_scale: 0.01

# Floor for action prob:
obs_prob_eps: 0.01
league_score_type: "acc"

figs_period: 5

train_subset_frac: 1.0

min_packets_in_trace: 1000
league_size: 15
obs_time_step_s: 0.02
obs_max_silence_s: 0.2
h_detach_period: 100
discounting: 0.99
trace_len: 10_000
batch_size: 32
grad_norm_clip: 1
label_smoothing: 0.02

predict_ks: 21
rnn_lr_reduction: 1.0
max_epochs: 128
