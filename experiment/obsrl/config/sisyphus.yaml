defaults:
  - _self_
  - defence: no_defence
  - dataset: bigenough
  - network: infinite
  - misc: default

experiment_name: sisypus
debug: False


advantages:
  type: "mc"
  lambda_: 0.95
  standardize: False
  divide_by_Z: False

rewards:
  d_clf: 0.001
  padding_scale: 0.01

obs:
  # Floor for action prob:
  prob_eps: 0.02
  time_step_s: 0.02
  max_silence_s: 0.2
  detach_period: 100
  critic_detach_period: 500
  lr: 0.001
  critic_lr: 0.0005
  #
  # When going up the ret needs to be higher than this
  # against the curent disc league.
  ret_thres_push: 40
  init_for_wait: True
  enable_entropy_loss: True
  separate_critic: True
  selection_entropy_scale: 0.005
  conditional_entropy_scale: 0.0002
  rnn_lr_reduction: 1.0

disc:
  detach_period: 1000
  # When coming down the disc needs to get below this against the
  loss_thres_roll: 1.4
  lr: 0.001
  predict_ks: 21

league:
  score_type: "acc"
  size: 10


ema_decay: 0.95
grad_norm_clip: 1
min_packets_in_trace: 1000
discounting: 0.99
trace_len: 10_000
batch_size: 32
label_smoothing: 0.02

max_epochs: 128


